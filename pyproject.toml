[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liquidity-lens"
version = "0.1.0"
description = "Real-time liquidity and order book imbalance monitor for Vietnamese equities (academic project)"
requires-python = ">=3.10"
dependencies = ["tzdata", "websockets>=14"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
